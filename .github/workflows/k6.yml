name: Load Test K6

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  load-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start Express API
        env:
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/api-crud-test
        run: |
          npm start &
          
          echo "Attente du démarrage du serveur..."
          for i in {1..15}; do
            if nc -z localhost 3000; then
              echo "Serveur démarré avec succès !"
              exit 0
            fi
            sleep 1
          done
          
          echo "Erreur : Le serveur n'a pas démarré à temps."
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # 1. Lancer k6, afficher les logs en direct, et les sauvegarder dans k6_output.txt
      - name: Run k6 load test
        id: k6_run
        run: |
          k6 run -e VUS=100 loadtest.js 2>&1 | tee k6_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # 2. Injecter le résumé k6 dans le Summary GitHub (s'exécute toujours, même en cas d'échec)
      - name: Publish k6 Summary to GitHub
        if: always()
        run: |
          echo "### 📊 Résumé du Test de Charge k6" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          cat k6_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # 3. Sauvegarder le rapport HTML en artefact
      - name: Upload k6 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-report
          path: rapport.html

      # 4. Faire échouer explicitement le job si k6 a échoué
      - name: Check k6 status
        if: steps.k6_run.outputs.exit_code != '0'
        run: exit 1

      # 5. Créer une GitHub Issue si le test échoue
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Alerte : Échec du test de charge k6',
              body: `Le test de charge automatique k6 a échoué sur la branche \`${context.ref_name}\`.\n\nLes seuils de performance ont été dépassés.\n\n👉 [Voir le résumé complet et les détails sur GitHub Actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });