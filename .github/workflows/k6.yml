name: Load Test K6 Multi-Tier

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  load-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start Express API
        env:
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/api-crud-test
        run: |
          npm start &
          
          echo "Attente du démarrage du serveur..."
          for i in {1..15}; do
            if nc -z localhost 3000; then
              echo "Serveur démarré avec succès !"
              exit 0
            fi
            sleep 1
          done
          
          echo "Erreur : Le serveur n'a pas démarré à temps."
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # 1. Boucle de tests multi-paliers (10, 100, 1000 VUs)
      - name: Run Multi-Tier k6 Load Tests
        id: k6_multi_run
        run: |
          echo "### 📊 Rapport Synthétique des Tests de Charge k6" >> $GITHUB_STEP_SUMMARY
          
          GLOBAL_FAILURE=0

          for vus in 10 100 1000; do
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Palier : **$vus Utilisateurs Virtuels (VUs)**" >> $GITHUB_STEP_SUMMARY
            
            set +e
            # L'option --quiet masque la progression en direct et conserve uniquement le résumé final
            k6 run --quiet -e VUS=$vus loadtest.js > k6_output_$vus.txt 2>&1
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -eq 0 ]; then
              echo "> **Statut :** ✅ **SUCCÈS** (Seuils respectés)" >> $GITHUB_STEP_SUMMARY
            else
              echo "> **Statut :** ❌ **ÉCHEC** (Seuils dépassés ou Surcharge)" >> $GITHUB_STEP_SUMMARY
              GLOBAL_FAILURE=1
            fi

            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>🔍 Afficher les détails métriques</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            cat k6_output_$vus.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          done

          if [ $GLOBAL_FAILURE -eq 1 ]; then
            echo "test_failed=true" >> $GITHUB_OUTPUT
          else
            echo "test_failed=false" >> $GITHUB_OUTPUT
          fi

      # 2. Sauvegarder les rapports de sortie en artefacts GitHub
      - name: Upload k6 reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports-all
          path: k6_output_*.txt

      # 3. Faire échouer explicitement le job si au moins un palier a échoué
      - name: Check global status
        if: steps.k6_multi_run.outputs.test_failed == 'true'
        run: exit 1

      # 4. Créer une GitHub Issue si un test a échoué
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Alerte : Échec du test de charge multi-paliers k6',
              body: `Le test de charge automatique k6 a détecté une défaillance sur l'un des paliers (10, 100 ou 1000 VUs) sur la branche \`${context.ref_name}\`.\n\n👉 [Voir le rapport détaillé et le résumé dans GitHub Actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });