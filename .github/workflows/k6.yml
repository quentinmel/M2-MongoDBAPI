name: Load Test K6

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      # 1. Récupérer le code du projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Installer les dépendances
      - name: Install dependencies
        run: npm install

      # 4. Démarrer l'API avec les variables d'environnement pour MongoDB local
      - name: Start Express API
        env:
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/api-crud-test
        run: |
          npm start &
          
          echo "Attente du démarrage du serveur..."
          for i in {1..15}; do
            if nc -z localhost 3000; then
              echo "Serveur démarré avec succès !"
              exit 0
            fi
            sleep 1
          done
          
          echo "Erreur : Le serveur n'a pas démarré à temps."
          exit 1

      # 5. Installer k6
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # 6. Lancer le test de charge k6 via npm
      - name: Run k6 load test
        run: npm run loadtest

      # 7. Sauvegarder le rapport HTML en artefact GitHub
      - name: Upload k6 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-report
          path: rapport.html