name: medislot-formation
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: medislot
      POSTGRES_USER: medislot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medislot-local-only}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medislot"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medislot
      DB_PASSWORD: ${DB_PASSWORD:-medislot-local-only}
      DEMO_SEED: "true"
      AB_ENABLED: ${AB_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: medislot-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0
    depends_on:
      db: {condition: service_healthy}
      collector: {condition: service_started}
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:8092:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend, collector]
    ports: ["127.0.0.1:8088:80"]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/collector.yaml"]
    volumes: ["./observabilite/collector.yaml:/etc/otelcol-contrib/collector.yaml:ro"]
    depends_on: [jaeger]
    ports: ["127.0.0.1:13133:13133"]
  sms-passerelle:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:5678", "-text=SMS passerelle de démonstration"]
volumes:
  pgdata:
